kind = "web"
previewPath = "/"
title = "BNP Paribas – Espace Client"
version = "1.0.0"
id = "artifacts/bnp-paribas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23617

[services.development]
run = "pnpm --filter @workspace/bnp-paribas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bnp-paribas", "run", "build" ]
publicDir = "artifacts/bnp-paribas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23617"
BASE_PATH = "/"
